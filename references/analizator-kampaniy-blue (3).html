<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Аналізатор кампаній · Facebook × Keitaro · Мультигео</title>
        <script
            crossorigin
            src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
        ></script>
        <script
            crossorigin
            src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
        ></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap");
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            :root {
                --bg: #080b14;
                --card: rgba(20, 20, 22, 0.82);
                --card-top: 30, 41, 64;
                --card-base: 14, 20, 34;
                --text: #e6edf3;
                --text-dim: #8b949e;
                --text-mid: #c9d1d9;
                --border: #2a2a30;
                --border-soft: rgba(122, 162, 220, 0.18);
                --accent: #4d9fff;
                --accent-rgb: 77, 159, 255;
                --accent2: #2563eb;
                --inp: #080b14;
                --grid: rgba(77, 159, 255, 0.06);
                --shadow: rgba(0, 0, 0, 0.55);
            }
            body {
                background: var(--bg);
            }
            #bg-canvas {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                z-index: 0;
                pointer-events: none;
                image-rendering: auto;
            }
            #bg-grid {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                background-image:
                    linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
                background-size: 42px 42px;
                mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 55%, transparent 100%);
                -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 55%, transparent 100%);
            }
            #root {
                position: relative;
                z-index: 1;
            }
            #bg-toggle {
                position: fixed;
                bottom: 16px;
                right: 16px;
                z-index: 50;
                background: var(--card);
                color: var(--text-dim);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 7px 12px;
                font-size: 12px;
                cursor: pointer;
                font-family: "Inter", sans-serif;
                backdrop-filter: blur(8px);
                transition:
                    color 0.2s,
                    border-color 0.2s;
            }
            #bg-toggle:hover {
                color: var(--accent);
                border-color: var(--accent);
            }
            *:focus-visible {
                outline: 2px solid #4d9fff;
                outline-offset: 1px;
            }
            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                    scroll-behavior: auto !important;
                }
                #bg-canvas {
                    display: none;
                }
            }
            html {
                scroll-behavior: smooth;
            }
            table {
                border-collapse: collapse;
            }
            ::-webkit-scrollbar {
                height: 8px;
                width: 8px;
            }
            ::-webkit-scrollbar-thumb {
                background: #2a2a30;
                border-radius: 4px;
            }
            @keyframes pulseRed {
                0%,
                100% {
                    box-shadow: 0 0 0 0 rgba(240, 85, 107, 0);
                    border-color: #f0556b;
                }
                50% {
                    box-shadow: 0 0 16px 2px rgba(240, 85, 107, 0.5);
                    border-color: #ff7085;
                }
            }
            .pulse-red {
                animation: pulseRed 3.6s ease-in-out infinite;
            }
            @keyframes glowSoft {
                0%,
                100% {
                    box-shadow: 0 0 0 0 var(--glow-c-0);
                }
                50% {
                    box-shadow: 0 0 20px 3px var(--glow-c-50);
                }
            }
            .glow-soft {
                animation: glowSoft 4.8s ease-in-out infinite;
            }
            @media (prefers-reduced-motion: reduce) {
                .pulse-red,
                .glow-soft {
                    animation: none !important;
                }
            }
        </style>
    </head>
    <body>
        <canvas id="bg-canvas"></canvas>
        <div id="bg-grid"></div>
        <button id="bg-toggle">✦ фон увімк.</button>
        <div id="root"></div>
        <script type="text/babel">
            const { useState, useMemo, useRef, useCallback, useEffect } = React;

            // ─────────── ДОВІДНИК ГЕО (код → прапор, укр.назва) + назва Keitaro → код ───────────
            const GEO = {
                SG: ["🇸🇬", "Сінгапур"],
                HR: ["🇭🇷", "Хорватія"],
                MY: ["🇲🇾", "Малайзія"],
                TW: ["🇹🇼", "Тайвань"],
                UA: ["🇺🇦", "Україна"],
                PL: ["🇵🇱", "Польща"],
                CZ: ["🇨🇿", "Чехія"],
                US: ["🇺🇸", "США"],
                GB: ["🇬🇧", "Британія"],
                DE: ["🇩🇪", "Німеччина"],
                FR: ["🇫🇷", "Франція"],
                IT: ["🇮🇹", "Італія"],
                ES: ["🇪🇸", "Іспанія"],
                IN: ["🇮🇳", "Індія"],
                ID: ["🇮🇩", "Індонезія"],
                PH: ["🇵🇭", "Філіппіни"],
                TH: ["🇹🇭", "Таїланд"],
                VN: ["🇻🇳", "В'єтнам"],
                JP: ["🇯🇵", "Японія"],
                KR: ["🇰🇷", "Корея"],
                BR: ["🇧🇷", "Бразилія"],
                MX: ["🇲🇽", "Мексика"],
                AR: ["🇦🇷", "Аргентина"],
                CA: ["🇨🇦", "Канада"],
                AU: ["🇦🇺", "Австралія"],
                TR: ["🇹🇷", "Туреччина"],
                SA: ["🇸🇦", "Саудівія"],
                AE: ["🇦🇪", "ОАЕ"],
                ZA: ["🇿🇦", "ПАР"],
                NG: ["🇳🇬", "Нігерія"],
                EG: ["🇪🇬", "Єгипет"],
                PK: ["🇵🇰", "Пакистан"],
                BD: ["🇧🇩", "Бангладеш"],
                NL: ["🇳🇱", "Нідерланди"],
                SE: ["🇸🇪", "Швеція"],
                NO: ["🇳🇴", "Норвегія"],
                FI: ["🇫🇮", "Фінляндія"],
                DK: ["🇩🇰", "Данія"],
                PT: ["🇵🇹", "Португалія"],
                GR: ["🇬🇷", "Греція"],
                RO: ["🇷🇴", "Румунія"],
                HU: ["🇭🇺", "Угорщина"],
                AT: ["🇦🇹", "Австрія"],
                CH: ["🇨🇭", "Швейцарія"],
                BE: ["🇧🇪", "Бельгія"],
                IE: ["🇮🇪", "Ірландія"],
                NZ: ["🇳🇿", "Нова Зеландія"],
                CL: ["🇨🇱", "Чилі"],
                CO: ["🇨🇴", "Колумбія"],
                PE: ["🇵🇪", "Перу"],
                KZ: ["🇰🇿", "Казахстан"],
                CN: ["🇨🇳", "Китай"],
                HK: ["🇭🇰", "Гонконг"],
                TWN: ["🇹🇼", "Тайвань"],
            };
            const KNAME2CODE = {
                Singapore: "SG",
                Croatia: "HR",
                Malaysia: "MY",
                Taiwan: "TW",
                Ukraine: "UA",
                Poland: "PL",
                Czechia: "CZ",
                "Czech Republic": "CZ",
                "United States": "US",
                "United Kingdom": "GB",
                Germany: "DE",
                France: "FR",
                Italy: "IT",
                Spain: "ES",
                India: "IN",
                Indonesia: "ID",
                Philippines: "PH",
                Thailand: "TH",
                Vietnam: "VN",
                Japan: "JP",
                "South Korea": "KR",
                Korea: "KR",
                Brazil: "BR",
                Mexico: "MX",
                Argentina: "AR",
                Canada: "CA",
                Australia: "AU",
                Turkey: "TR",
                "Saudi Arabia": "SA",
                "United Arab Emirates": "AE",
                "South Africa": "ZA",
                Nigeria: "NG",
                Egypt: "EG",
                Pakistan: "PK",
                Bangladesh: "BD",
                Netherlands: "NL",
                Sweden: "SE",
                Norway: "NO",
                Finland: "FI",
                Denmark: "DK",
                Portugal: "PT",
                Greece: "GR",
                Romania: "RO",
                Hungary: "HU",
                Austria: "AT",
                Switzerland: "CH",
                Belgium: "BE",
                Ireland: "IE",
                "New Zealand": "NZ",
                Chile: "CL",
                Colombia: "CO",
                Peru: "PE",
                Kazakhstan: "KZ",
                China: "CN",
                "Hong Kong": "HK",
            };
            const nameToCode = (name) => KNAME2CODE[name] || name;
            // Витягуємо ключ креатива КодКраїни_Номер (напр. KR_54) з назви типу "🇰🇷_KR_54_[Olympus]"
            const parseCreative = (name) => {
                const m = String(name || "").match(/([A-Z]{2})_(\d+)/);
                return m ? { key: `${m[1]}_${m[2]}`, cc: m[1] } : null;
            };
            // Оффер: ID без коми з пробілом-роздільником тисяч (12846 → "12 846"), назва = перші 6 блоків через |
            const parseOffer = (oid, offer) => {
                const raw = String(offer || "").trim();
                if (!raw || raw === "WWL Smartlink") return null;
                const idClean = String(oid || "")
                    .replace(/,/g, "")
                    .trim();
                const idFmt = idClean;
                const shortName = raw
                    .split("|")
                    .map((p) => p.trim())
                    .slice(0, 6)
                    .join(" | ");
                return { id: idFmt, name: shortName, label: `${idFmt}  ${shortName}` };
            };
            const geoLabel = (code) => {
                const g = GEO[code];
                return g ? `${g[0]} ${g[1]}` : code;
            };
            const geoFlag = (code) => {
                const g = GEO[code];
                return g ? g[0] : "🏳";
            };
            const geoName = (code) => {
                const g = GEO[code];
                return g ? g[1] : code;
            };

            // ─────────── helpers ───────────
            const num = (v) => {
                if (v === null || v === undefined) return 0;
                let s = String(v).trim().replace(/\$/g, "").replace(/\s/g, "");
                if (s === "") return 0;
                if (s.indexOf(",") > -1 && s.indexOf(".") === -1) s = s.replace(",", ".");
                else s = s.replace(/,/g, "");
                const n = parseFloat(s);
                return isNaN(n) ? 0 : n;
            };
            const COL = { green: "#3ddc84", yellow: "#e0b83a", red: "#f0556b", neutral: "#9aa0a8" };

            // ─────────── ТЕМИ ───────────
            const THEMES = {
                dark: {
                    name: "dark",
                    bg: "var(--bg)",
                    bgGrad: ["#070a12", "var(--bg)", "#0a0e18"],
                    card: "rgba(20,20,22,0.82)",
                    cardTintBase: "14,20,34",
                    cardTintTop: "30,41,64",
                    text: "var(--text)",
                    textDim: "var(--text-dim)",
                    textMid: "var(--text-mid)",
                    border: "var(--border)",
                    borderSoft: "rgba(122,162,220,0.18)",
                    accent: "#4d9fff",
                    accent2: "#2563eb",
                    accentRgb: "77,159,255",
                    inp: "var(--bg)",
                    inpText: "var(--text)",
                    gridLine: "rgba(77,159,255,0.06)",
                    blobLight: 55,
                    blobAlpha: 1,
                },
                light: {
                    name: "light",
                    bg: "#eef4fc",
                    bgGrad: ["#f2f7ff", "#eaf1fb", "#e4edf9"],
                    card: "rgba(255,255,255,0.78)",
                    cardTintBase: "255,255,255",
                    cardTintTop: "225,238,255",
                    text: "#16233a",
                    textDim: "#5b6b83",
                    textMid: "#33455f",
                    border: "#cdd8e8",
                    borderSoft: "rgba(77,159,255,0.28)",
                    accent: "#2f7fe0",
                    accent2: "#1f6feb",
                    accentRgb: "47,127,224",
                    inp: "#ffffff",
                    inpText: "#16233a",
                    gridLine: "rgba(47,127,224,0.10)",
                    blobLight: 72,
                    blobAlpha: 0.5,
                },
            };
            const zoneOf = (price, t) => (price < t.gy ? "green" : price <= t.yr ? "yellow" : "red");
            const zoneLabel = (z) =>
                z === "green" ? "зелена" : z === "yellow" ? "жовта" : z === "red" ? "червона" : "нейтр.";
            const metricColor = (price, t) => (price == null ? COL.neutral : COL[zoneOf(price, t)]);
            const money = (v) => (v == null ? "—" : `$${v.toFixed(2)}`);

            // ROI/ROAS зони — фіксовані
            const roiZone = (roi) => (roi == null ? "neutral" : roi < -20 ? "red" : roi <= 30 ? "yellow" : "green");
            const roiColor = (roi) => COL[roiZone(roi)];

            const THRESHOLD_DEFAULT = {
                installs: { gy: 2, yr: 4 },
                regs: { gy: 5, yr: 10 },
                sales: { gy: 30, yr: 60 },
                clicks: { gy: 0.2, yr: 0.5 },
            };

            function decide(c, p, hasMain, hasClicks) {
                const { spend, clicks, installs, regs, sales } = c;
                if (spend === 0)
                    return { bucket: "neutral", zone: "neutral", why: "Spend 0 — не аналізується", waste: 0 };
                if (sales > 0) {
                    const v = spend / sales;
                    const z = zoneOf(v, p.sales);
                    return {
                        bucket: z,
                        zone: z,
                        why: `Продажі: CPS $${v.toFixed(2)} — ${zoneLabel(z)}`,
                        waste: z === "red" ? Math.max(0, spend - p.sales.yr * sales) : 0,
                    };
                }
                if (regs > 0) {
                    const v = spend / regs;
                    const z = zoneOf(v, p.regs);
                    return {
                        bucket: z,
                        zone: z,
                        why: `Реєстрації: CPR $${v.toFixed(2)} — ${zoneLabel(z)}`,
                        waste: z === "red" ? Math.max(0, spend - p.regs.yr * regs) : 0,
                    };
                }
                if (installs > 0) {
                    const v = spend / installs;
                    const z = zoneOf(v, p.installs);
                    return {
                        bucket: z,
                        zone: z,
                        why: `Інстали: CPI $${v.toFixed(2)} — ${zoneLabel(z)}`,
                        waste: z === "red" ? Math.max(0, spend - p.installs.yr * installs) : 0,
                    };
                }
                if (hasClicks && clicks > 0) {
                    const v = spend / clicks;
                    const z = zoneOf(v, p.clicks);
                    if (z === "red")
                        return {
                            bucket: "red",
                            zone: "red",
                            why: `Кліки: CPC $${v.toFixed(2)} — червона`,
                            waste: Math.max(0, spend - p.clicks.yr * clicks),
                        };
                    return {
                        bucket: "neutral",
                        zone: "neutral",
                        why: `Кліки: CPC $${v.toFixed(2)} — ${zoneLabel(z)}, чекаємо інстал`,
                        waste: 0,
                    };
                }
                if (hasMain && spend > p.sales.yr)
                    return {
                        bucket: "red",
                        zone: "red",
                        why: `Продажі: 0 за $${spend.toFixed(2)} (понад черв.)`,
                        waste: spend - p.sales.yr,
                    };
                if (hasMain && spend > p.regs.yr)
                    return {
                        bucket: "red",
                        zone: "red",
                        why: `Реєстрації: 0 за $${spend.toFixed(2)} (понад черв.)`,
                        waste: spend - p.regs.yr,
                    };
                if (hasMain && spend > p.installs.yr)
                    return {
                        bucket: "red",
                        zone: "red",
                        why: `Інстали: 0 за $${spend.toFixed(2)} (понад черв.)`,
                        waste: spend - p.installs.yr,
                    };
                if (hasClicks && spend > p.clicks.yr)
                    return {
                        bucket: "red",
                        zone: "red",
                        why: `Кліки: 0 за $${spend.toFixed(2)} (понад черв.)`,
                        waste: spend - p.clicks.yr,
                    };
                return {
                    bucket: "neutral",
                    zone: "neutral",
                    why: `Рано судити (spend $${spend.toFixed(2)})`,
                    waste: 0,
                };
            }

            const parseCsv = (text) => Papa.parse(text, { header: true, skipEmptyLines: true, delimiter: "" }).data;
            const getKey = (row, name) => {
                for (const k of Object.keys(row)) if (k.trim() === name) return row[k];
                return undefined;
            };
            const isFb = (rows) =>
                rows.length &&
                Object.keys(rows[0])
                    .map((k) => k.trim())
                    .some((k) => k === "Account ID" || k === "Amount spent (USD)");
            const isKt = (rows) =>
                rows.length &&
                Object.keys(rows[0])
                    .map((k) => k.trim())
                    .some((k) => k === "Sub ID 2" || k === "UC (campaign)");

            // ─────────── стилі ───────────
            const S = {
                page: {
                    fontFamily: "'Inter', system-ui, sans-serif",
                    color: "var(--text)",
                    minHeight: "100vh",
                    padding: "20px",
                },
                mono: { fontFamily: "'Roboto Mono', monospace" },
                card: {
                    background:
                        "linear-gradient(180deg, rgba(var(--card-top),0.55) 0%, rgba(var(--card-base),0.72) 100%)",
                    border: "1px solid var(--border-soft)",
                    borderRadius: 14,
                    padding: 16,
                    marginBottom: 16,
                    backdropFilter: "blur(8px)",
                    WebkitBackdropFilter: "blur(8px)",
                    boxShadow: "0 8px 32px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08)",
                },
                h: {
                    fontSize: 13,
                    textTransform: "uppercase",
                    letterSpacing: 1,
                    color: "var(--text-dim)",
                    margin: "0 0 12px",
                },
                drop: (active) => ({
                    flex: 1,
                    minWidth: 200,
                    border: `1.5px dashed ${active ? "var(--accent)" : "var(--border)"}`,
                    borderRadius: 8,
                    padding: 18,
                    textAlign: "center",
                    background: active ? "rgba(var(--accent-rgb),0.12)" : "var(--bg)",
                    cursor: "pointer",
                    fontSize: 13,
                    display: "block",
                    position: "relative",
                }),
                inp: {
                    background: "var(--bg)",
                    border: "1px solid var(--border)",
                    color: "var(--text)",
                    borderRadius: 6,
                    padding: "6px 8px",
                    width: 60,
                    fontFamily: "'Roboto Mono', monospace",
                    fontSize: 13,
                },
                btn: {
                    background: "linear-gradient(145deg, var(--accent) 0%, var(--accent2) 100%)",
                    color: "#fff",
                    border: "none",
                    borderRadius: 6,
                    padding: "8px 14px",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 600,
                    boxShadow: "0 0 12px rgba(var(--accent-rgb),0.35)",
                },
                btnGhost: {
                    background: "transparent",
                    color: "var(--text-mid)",
                    border: "1px solid var(--border)",
                    borderRadius: 6,
                    padding: "6px 10px",
                    cursor: "pointer",
                    fontSize: 12,
                },
            };
            const td = { padding: "5px 6px" };
            const tdR = { ...td, textAlign: "right" };

            const Metric = ({ v, t, prefix }) => (
                <span
                    style={{
                        ...S.mono,
                        color: metricColor(v, t),
                        fontWeight: v != null && zoneOf(v, t) === "red" ? 700 : 400,
                    }}
                >
                    {prefix}
                    {money(v)}
                </span>
            );

            const ThreshRow = ({ label, metric, t, onChange }) => (
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8, flexWrap: "wrap" }}>
                    <span style={{ width: 90, fontSize: 13 }}>{label}</span>
                    <span style={{ fontSize: 11, color: COL.green }}>зел &lt;</span>
                    <input style={S.inp} value={t.gy} onChange={(e) => onChange(metric, "gy", e.target.value)} />
                    <span style={{ fontSize: 11, color: COL.yellow }}>жовт ≤</span>
                    <input style={S.inp} value={t.yr} onChange={(e) => onChange(metric, "yr", e.target.value)} />
                    <span style={{ fontSize: 11, color: COL.red }}>&lt; черв</span>
                </div>
            );

            const CampHead = () => (
                <thead>
                    <tr>
                        <th style={{ borderBottom: "1px solid var(--border)" }}></th>
                        <th style={{ borderBottom: "1px solid var(--border)", width: 6 }}></th>
                        {[
                            "Campaign ID",
                            "Spend",
                            "Rev",
                            "Clicks",
                            "Inst",
                            "Reg",
                            "Sale",
                            "CPC",
                            "CPI",
                            "CPR",
                            "CPS",
                            "Чому",
                        ].map((h, i) => (
                            <th
                                key={h}
                                style={{
                                    borderBottom: "1px solid var(--border)",
                                    textAlign: i === 0 || i === 11 ? "left" : "right",
                                    padding: "7px 6px",
                                    fontSize: 11,
                                    color: "var(--text-dim)",
                                    whiteSpace: "nowrap",
                                }}
                            >
                                {h}
                            </th>
                        ))}
                    </tr>
                </thead>
            );

            const CampRow = ({ c, ctx }) => (
                <tr style={{ background: ctx.excluded[c.id] ? "#1c1208" : "transparent" }}>
                    <td style={td}>
                        <input
                            type="checkbox"
                            checked={!ctx.excluded[c.id]}
                            onChange={() => ctx.setExcluded((x) => ({ ...x, [c.id]: !x[c.id] }))}
                        />
                    </td>
                    <td style={{ background: COL[c.zone], width: 6 }}></td>
                    <td style={{ ...S.mono, ...td, color: "var(--text-mid)" }}>{c.id}</td>
                    <td style={{ ...S.mono, ...tdR }}>${c.spend.toFixed(2)}</td>
                    <td style={{ ...S.mono, ...tdR, color: c.revenue > 0 ? COL.green : "var(--text-dim)" }}>
                        {c.revenue > 0 ? `$${c.revenue.toFixed(2)}` : "—"}
                    </td>

            // ─────────── ГОЛОВНИЙ КОМПОНЕНТ ───────────
            function App() {
                const [fbFiles, setFbFiles] = useState([]);
                const [kt, setKt] = useState(null);
                const [ktClicks, setKtClicks] = useState(null);
                const [parsed, setParsed] = useState(null); // {geos:[code...], campaignsByGeo:{code:[camp...]}, hasMain, hasClicks}
                const [activeGeo, setActiveGeo] = useState(null);

                // пресети по гео: { [code]: [ {name, installs, regs, sales, clicks} ] }, активний індекс: { [code]: idx }
                const [geoPresets, setGeoPresets] = useState({});
                const [activePresetIdx, setActivePresetIdx] = useState({});
                // спільні налаштування
                const [shared, setShared] = useState({ wasteZones: { gy: 7, yr: 15 }, reviewMult: 2, commission: 0 });

                const [excluded, setExcluded] = useState({});
                const [collapsed, setCollapsed] = useState({});
                const [checkedAccs, setCheckedAccs] = useState({});
                const [copied, setCopied] = useState("");
                const [fileHandle, setFileHandle] = useState(null);
                const [saveMsg, setSaveMsg] = useState("");
                const [startModal, setStartModal] = useState(true);

                // ── завантаження файлів ──
                const addFbFiles = (fileList) => {
                    Array.from(fileList).forEach((file) => {
                        const reader = new FileReader();
                        reader.onload = () => {
                            const rows = parseCsv(String(reader.result));
                            if (isFb(rows))
                                setFbFiles((prev) =>
                                    prev.some((f) => f.name === file.name) ? prev : [...prev, { name: file.name, rows }]
                                );
                            else if (isKt(rows)) setKt({ name: file.name, rows });
                        };
                        reader.readAsText(file);
                    });
                };
                const addKt = (fileList) => {
                    const file = fileList[0];
                    if (!file) return;
                    const r = new FileReader();
                    r.onload = () => {
                        const rows = parseCsv(String(r.result));
                        if (isKt(rows)) setKt({ name: file.name, rows });
                        else if (isFb(rows)) addFbFiles([file]);
                    };
                    r.readAsText(file);
                };
                const addKtClicks = (fileList) => {
                    const file = fileList[0];
                    if (!file) return;
                    const r = new FileReader();
                    r.onload = () => {
                        setKtClicks({ name: file.name, rows: parseCsv(String(r.result)) });
                    };
                    r.readAsText(file);
                };
                const removeFb = (name) => setFbFiles((prev) => prev.filter((f) => f.name !== name));
                const clearFb = () => setFbFiles([]);
                const clearKt = () => setKt(null);
                const clearKtClicks = () => setKtClicks(null);

                // ── парсинг по гео (будуємо мапи, фільтруємо по гео) ──
                const buildAnalysis = useCallback(() => {
                    if (!fbFiles.length || (!kt && !ktClicks)) return;
                    const hasMain = !!kt,
                        hasClicks = !!ktClicks;
                    // мапи Keitaro: (id+code)->дані, та id->[рядки] для відкату
                    const mainByIdGeo = new Map(),
                        mainById = new Map();
                    if (kt)
                        for (const r of kt.rows) {
                            const id = String(getKey(r, "Sub ID 2") ?? "").trim();
                            if (!id || id.startsWith("{")) continue;
                            const code = nameToCode(String(getKey(r, "Country") ?? "").trim());
                            const d = {
                                installs: num(getKey(r, "UC (campaign)")),
                                regs: num(getKey(r, "Conv.")),
                                sales: num(getKey(r, "Sales")),
                                revenue: num(getKey(r, "Revenue")),
                            };
                            mainByIdGeo.set(id + "|" + code, d);
                            if (!mainById.has(id)) mainById.set(id, []);
                            mainById.get(id).push(d);
                        }
                    const clkByIdGeo = new Map(),
                        clkById = new Map();
                    if (ktClicks)
                        for (const r of ktClicks.rows) {
                            const id = String(getKey(r, "Sub ID 2") ?? "").trim();
                            if (!id || id.startsWith("{")) continue;
                            const code = nameToCode(String(getKey(r, "Country") ?? "").trim());
                            const v = num(getKey(r, "UC (campaign)"));
                            clkByIdGeo.set(id + "|" + code, v);
                            if (!clkById.has(id)) clkById.set(id, []);
                            clkById.get(id).push(v);
                        }
                    const getMain = (id, code) => {
                        const hit = mainByIdGeo.get(id + "|" + code);
                        if (hit) return hit;
                        const lst = mainById.get(id);
                        if (lst && lst.length === 1) return lst[0];
                        return { installs: 0, regs: 0, sales: 0, revenue: 0 };
                    };
                    const getClicks = (id, code) => {
                        const hit = clkByIdGeo.get(id + "|" + code);
                        if (hit !== undefined) return hit;
                        const lst = clkById.get(id);
                        if (lst && lst.length === 1) return lst[0];
                        return 0;
                    };
                    // Прямі суми по Country (незалежно від метчингу) — для чесного тоталу профіту/ROI по гео
                    const revByCountry = {}; // з основного Keitaro
                    if (kt)
                        for (const r of kt.rows) {
                            const code = nameToCode(String(getKey(r, "Country") ?? "").trim());
                            if (!code) continue;
                            revByCountry[code] = (revByCountry[code] || 0) + num(getKey(r, "Revenue"));
                        }
                    const spendByCountry = {}; // з FB
                    for (const file of fbFiles)
                        for (const r of file.rows) {
                            const code = String(getKey(r, "Country") ?? "").trim();
                            if (!code) continue;
                            spendByCountry[code] = (spendByCountry[code] || 0) + num(getKey(r, "Amount spent (USD)"));
                        }
                    // проходимо FB, групуємо кампанії по гео
                    const campaignsByGeo = {};
                    const geoSpend = {};
                    const seen = new Set();
                    let dropped = 0;
                    for (const file of fbFiles) {
                        for (const r of file.rows) {
                            const code = String(getKey(r, "Country") ?? "").trim();
                            const acc = String(getKey(r, "Account ID") ?? "").trim();
                            const id = String(getKey(r, "Campaign ID") ?? "").trim();
                            if (!id) continue;
                            if (!/^\d+$/.test(acc)) {
                                dropped++;
                                continue;
                            }
                            if (!code) {
                                dropped++;
                                continue;
                            }
                            const dedup = id + "|" + code;
                            if (seen.has(dedup)) continue;
                            seen.add(dedup);
                            const spend = num(getKey(r, "Amount spent (USD)"));
                            const m = getMain(id, code);
                            const clicks = getClicks(id, code);
                            const c = {
                                id,
                                acc,
                                code,
                                spend,
                                clicks,
                                installs: m.installs,
                                regs: m.regs,
                                sales: m.sales,
                                revenue: m.revenue,
                            };
                            if (!campaignsByGeo[code]) campaignsByGeo[code] = [];
                            campaignsByGeo[code].push(c);
                            if (spend > 0) geoSpend[code] = (geoSpend[code] || 0) + spend;
                        }
                    }
                    // гео тільки ті, де spend>0
                    const geos = Object.keys(geoSpend).sort((a, b) => geoSpend[b] - geoSpend[a]);

                    // ── КРЕАТИВИ: метч по ключу (КодКраїни_Номер) + гео ──
                    // FB: spend + impressions по (ключ+гео) з Ad name
                    const crFb = new Map();
                    for (const file of fbFiles)
                        for (const r of file.rows) {
                            const country = String(getKey(r, "Country") ?? "").trim();
                            if (!country) continue;
                            const cr = parseCreative(getKey(r, "Ad name"));
                            if (!cr) continue;
                            const key = cr.key + "|" + country;
                            if (!crFb.has(key))
                                crFb.set(key, { key: cr.key, cc: cr.cc, code: country, spend: 0, impressions: 0 });
                            const d = crFb.get(key);
                            d.spend += num(getKey(r, "Amount spent (USD)"));
                            d.impressions += num(getKey(r, "Impressions"));
                        }
                    // Keitaro main: installs/regs/sales по (ключ+гео) з Sub ID 5
                    const crMain = new Map();
                    if (kt)
                        for (const r of kt.rows) {
                            const cr = parseCreative(getKey(r, "Sub ID 5"));
                            if (!cr) continue;
                            const code = nameToCode(String(getKey(r, "Country") ?? "").trim());
                            const key = cr.key + "|" + code;
                            if (!crMain.has(key)) crMain.set(key, { installs: 0, regs: 0, sales: 0, revenue: 0 });
                            const d = crMain.get(key);
                            d.installs += num(getKey(r, "UC (campaign)"));
                            d.regs += num(getKey(r, "Conv."));
                            d.sales += num(getKey(r, "Sales"));
                            d.revenue += num(getKey(r, "Revenue"));
                        }
                    // Keitaro clicks: по (ключ+гео) з Sub ID 5
                    const crClk = new Map();
                    if (ktClicks)
                        for (const r of ktClicks.rows) {
                            const cr = parseCreative(getKey(r, "Sub ID 5"));
                            if (!cr) continue;
                            const code = nameToCode(String(getKey(r, "Country") ?? "").trim());
                            const key = cr.key + "|" + code;
                            crClk.set(key, (crClk.get(key) || 0) + num(getKey(r, "UC (campaign)")));
                        }
                    // зводимо креативи по гео
                    const creativesByGeo = {};
                    for (const [key, fb] of crFb) {
                        const m = crMain.get(key) || { installs: 0, regs: 0, sales: 0, revenue: 0 };
                        const clicks = crClk.get(key) || 0;
                        const c = {
                            key: fb.key,
                            cc: fb.cc,
                            code: fb.code,
                            spend: fb.spend,
                            impressions: fb.impressions,
                            clicks,
                            installs: m.installs,
                            regs: m.regs,
                            sales: m.sales,
                            revenue: m.revenue,
                        };
                        if (!creativesByGeo[fb.code]) creativesByGeo[fb.code] = [];
                        creativesByGeo[fb.code].push(c);
                    }

                    // ── ОФЕРИ та OS (з основного Keitaro, метч по гео; spend оцінюється в analyzed) ──
                    const offersByGeo = {},
                        osByGeo = {};
                    if (kt)
                        for (const r of kt.rows) {
                            const code = nameToCode(String(getKey(r, "Country") ?? "").trim());
                            if (!code) continue;
                            const installs = num(getKey(r, "UC (campaign)")),
                                regs = num(getKey(r, "Conv.")),
                                sales = num(getKey(r, "Sales")),
                                revenue = num(getKey(r, "Revenue"));
                            // оффер
                            const off = parseOffer(getKey(r, "Offer ID"), getKey(r, "Offer"));
                            if (off) {
                                if (!offersByGeo[code]) offersByGeo[code] = new Map();
                                const k = off.label;
                                if (!offersByGeo[code].has(k))
                                    offersByGeo[code].set(k, {
                                        id: off.id,
                                        name: off.name,
                                        label: off.label,
                                        installs: 0,
                                        regs: 0,
                                        sales: 0,
                                        revenue: 0,
                                    });
                                const d = offersByGeo[code].get(k);
                                d.installs += installs;
                                d.regs += regs;
                                d.sales += sales;
                                d.revenue += revenue;
                            }
                            // OS — лише Android та iOS (решту відкидаємо повністю)
                            const osRaw = String(getKey(r, "OS") ?? "")
                                .trim()
                                .toLowerCase();
                            const os = osRaw === "android" ? "Android" : osRaw === "ios" ? "iOS" : null;
                            if (os) {
                                if (!osByGeo[code]) osByGeo[code] = new Map();
                                if (!osByGeo[code].has(os))
                                    osByGeo[code].set(os, {
                                        os,
                                        installs: 0,
                                        regs: 0,
                                        sales: 0,
                                        revenue: 0,
                                        clicks: 0,
                                    });
                                const d = osByGeo[code].get(os);
                                d.installs += installs;
                                d.regs += regs;
                                d.sales += sales;
                                d.revenue += revenue;
                            }
                        }
                    // OS clicks з клік-Keitaro (лише Android/iOS)
                    if (ktClicks)
                        for (const r of ktClicks.rows) {
                            const code = nameToCode(String(getKey(r, "Country") ?? "").trim());
                            if (!code) continue;
                            const osRaw = String(getKey(r, "OS") ?? "")
                                .trim()
                                .toLowerCase();
                            const os = osRaw === "android" ? "Android" : osRaw === "ios" ? "iOS" : null;
                            if (!os) continue;
                            if (!osByGeo[code]) osByGeo[code] = new Map();
                            if (!osByGeo[code].has(os))
                                osByGeo[code].set(os, { os, installs: 0, regs: 0, sales: 0, revenue: 0, clicks: 0 });
                            osByGeo[code].get(os).clicks += num(getKey(r, "UC (campaign)"));
                        }
                    // Map -> масив
                    const offersArr = {},
                        osArr = {};
                    for (const code in offersByGeo) offersArr[code] = [...offersByGeo[code].values()];
                    for (const code in osByGeo) osArr[code] = [...osByGeo[code].values()];

                    setParsed({
                        campaignsByGeo,
                        geos,
                        hasMain,
                        hasClicks,
                        dropped,
                        revByCountry,
                        spendByCountry,
                        creativesByGeo,
                        offersByGeo: offersArr,
                        osByGeo: osArr,
                    });
                    setActiveGeo((prev) => (prev && geos.includes(prev) ? prev : geos[0] || null));
                    // всі акаунти згорнуті за замовчуванням при генерації
                    const allAccs = {};
                    for (const code in campaignsByGeo) for (const c of campaignsByGeo[code]) allAccs[c.acc] = true;
                    setCollapsed(allAccs);
                }, [fbFiles, kt, ktClicks]);

                // ── активний пресет для поточного гео (числовий) ──
                const presetRawList = activeGeo ? geoPresets[activeGeo] || [] : [];
                const activeIdx = activeGeo != null ? (activePresetIdx[activeGeo] ?? 0) : 0;
                const presetRaw = presetRawList[activeIdx] || { name: "Дефолт", ...THRESHOLD_DEFAULT };
                const preset = useMemo(
                    () => ({
                        name: presetRaw.name,
                        installs: { gy: num(presetRaw.installs.gy), yr: num(presetRaw.installs.yr) },
                        regs: { gy: num(presetRaw.regs.gy), yr: num(presetRaw.regs.yr) },
                        sales: { gy: num(presetRaw.sales.gy), yr: num(presetRaw.sales.yr) },
                        clicks: { gy: num((presetRaw.clicks || {}).gy), yr: num((presetRaw.clicks || {}).yr) },
                        wasteZones: { gy: num(shared.wasteZones.gy) || 7, yr: num(shared.wasteZones.yr) || 15 },
                        reviewMult: num(shared.reviewMult) || 2,
                        commission: num(shared.commission) || 0,
                    }),
                    [presetRaw, shared]
                );

                // якщо для гео ще нема пресетів — створюємо дефолтний
                useEffect(() => {
                    if (activeGeo && !(geoPresets[activeGeo] && geoPresets[activeGeo].length)) {
                        setGeoPresets((p) => ({
                            ...p,
                            [activeGeo]: [{ name: "Дефолт", ...JSON.parse(JSON.stringify(THRESHOLD_DEFAULT)) }],
                        }));
                        setActivePresetIdx((p) => ({ ...p, [activeGeo]: 0 }));
                    }
                }, [activeGeo]);

                // ── аналіз активного гео ──
                const analyzed = useMemo(() => {
                    if (!parsed || !activeGeo) return null;
                    const camps = parsed.campaignsByGeo[activeGeo] || [];
                    const accounts = new Map();
                    let geoSpend = 0,
                        geoRev = 0,
                        geoClicks = 0,
                        geoInst = 0,
                        geoReg = 0,
                        geoSales = 0;
                    for (const c0 of camps) {
                        const c = { ...c0 };
                        const d = decide(c, preset, parsed.hasMain, parsed.hasClicks);
                        c.cpi = c.installs ? c.spend / c.installs : null;
                        c.cpr = c.regs ? c.spend / c.regs : null;
                        c.cps = c.sales ? c.spend / c.sales : null;
                        c.cpc = c.clicks ? c.spend / c.clicks : null;
                        c.bucket = d.bucket;
                        c.zone = d.zone;
                        c.why = d.why;
                        c.waste = d.waste || 0;
                        if (!accounts.has(c.acc))
                            accounts.set(c.acc, {
                                acc: c.acc,
                                campaigns: [],
                                spend: 0,
                                clicks: 0,
                                installs: 0,
                                regs: 0,
                                sales: 0,
                                revenue: 0,
                            });
                        const a = accounts.get(c.acc);
                        a.campaigns.push(c);
                        a.spend += c.spend;
                        a.clicks += c.clicks;
                        a.installs += c.installs;
                        a.regs += c.regs;
                        a.sales += c.sales;
                        a.revenue += c.revenue;
                        geoSpend += c.spend;
                        geoRev += c.revenue;
                        geoClicks += c.clicks;
                        geoInst += c.installs;
                        geoReg += c.regs;
                        geoSales += c.sales;
                    }
                    const yrI = preset.installs.yr,
                        K = preset.reviewMult;
                    const accList = [...accounts.values()]
                        .map((a) => {
                            a.cpi = a.installs ? a.spend / a.installs : null;
                            a.cpr = a.regs ? a.spend / a.regs : null;
                            a.cps = a.sales ? a.spend / a.sales : null;
                            a.cpc = a.clicks ? a.spend / a.clicks : null;
                            a.roi = a.spend > 0 ? ((a.revenue - a.spend) / a.spend) * 100 : null;
                            a.roas = a.spend > 0 ? a.revenue / a.spend : null;
                            a.profit = a.revenue - a.spend * (1 + (preset.commission || 0) / 100);
                            a.counts = { red: 0, yellow: 0, green: 0, neutral: 0 };
                            a.waste = 0;
                            for (const c of a.campaigns) {
                                a.counts[c.bucket]++;
                                a.waste += c.waste || 0;
                            }
                            const rule1 = a.spend >= K * yrI && a.installs === 0;
                            const cpiBad = a.cpi != null && a.cpi >= K * yrI;
                            const cprBad = (a.cpr != null && a.cpr > preset.regs.yr) || a.regs === 0;
                            const rule2 = cpiBad && cprBad && a.sales === 0;
                            a.problem = parsed.hasMain && (rule1 || rule2);
                            a.problemReason = !a.problem
                                ? ""
                                : rule1
                                  ? `0 інсталів за spend $${a.spend.toFixed(2)} (≥ $${(K * yrI).toFixed(0)})`
                                  : `уніки дорогі (CPI ${money(a.cpi)}), реги погані, 0 депозитів`;
                            a.salesCamps = a.campaigns.filter((c) => c.sales > 0);
                            a.salesStat = a.salesCamps.reduce(
                                (s, c) => ({
                                    spend: s.spend + c.spend,
                                    clicks: s.clicks + c.clicks,
                                    inst: s.inst + c.installs,
                                    reg: s.reg + c.regs,
                                    sales: s.sales + c.sales,
                                }),
                                { spend: 0, clicks: 0, inst: 0, reg: 0, sales: 0 }
                            );
                            return a;
                        })
                        .filter((a) => a.spend > 0)
                        .sort((x, y) => y.spend - x.spend);
                    const totalWaste = accList.reduce((s, a) => s + a.waste, 0);
                    // Тотал по КРАЇНІ (незалежно від метчингу сабів) — для чесного профіту/ROI
                    const countrySpend = (parsed.spendByCountry && parsed.spendByCountry[activeGeo]) || 0;
                    const countryRev = (parsed.revByCountry && parsed.revByCountry[activeGeo]) || 0;
                    const geo = {
                        spend: geoSpend,
                        revenue: countryRev,
                        cpc: geoClicks ? geoSpend / geoClicks : null,
                        cpi: geoInst ? geoSpend / geoInst : null,
                        cpr: geoReg ? geoSpend / geoReg : null,
                        cps: geoSales ? geoSpend / geoSales : null,
                        roi: countrySpend > 0 ? ((countryRev - countrySpend) / countrySpend) * 100 : null,
                        profit: countryRev - countrySpend * (1 + (preset.commission || 0) / 100),
                        countrySpend,
                    };
                    // ── креативи активного гео: метрики + рішення по наших зонах ──
                    const commRate = 1 + (preset.commission || 0) / 100;
                    const creatives = ((parsed.creativesByGeo && parsed.creativesByGeo[activeGeo]) || [])
                        .map((c0) => {
                            const c = { ...c0 };
                            const d = decide(c, preset, parsed.hasMain, parsed.hasClicks);
                            c.cpi = c.installs ? c.spend / c.installs : null;
                            c.cpr = c.regs ? c.spend / c.regs : null;
                            c.cps = c.sales ? c.spend / c.sales : null;
                            c.cpc = c.clicks ? c.spend / c.clicks : null;
                            c.ctr = c.impressions ? (c.clicks / c.impressions) * 100 : null;
                            c.cpm = c.impressions ? (c.spend / c.impressions) * 1000 : null;
                            c.profit = c.revenue - c.spend * commRate; // реальний spend з комісією
                            c.bucket = d.bucket;
                            c.zone = d.zone;
                            c.why = d.why;
                            return c;
                        })
                        .filter((c) => c.spend > 0)
                        .sort((a, b) => b.spend - a.spend);

                    // ── ОФЕРИ та OS: аналітична модель (est_spend = installs × середній CPI гео) ──
                    const avgCPI = geoInst ? geoSpend / geoInst : 0;
                    const comm = commRate;
                    const calcModel = (o) => {
                        const est = o.installs * avgCPI; // оцінений spend
                        const estC = est * comm; // з комісією (для ROI)
                        return {
                            ...o,
                            estSpend: est,
                            profit: o.revenue - estC, // оцінений spend з комісією
                            cpc: o.clicks ? est / o.clicks : null,
                            cpi: o.installs ? est / o.installs : null,
                            cpr: o.regs ? est / o.regs : null,
                            cps: o.sales ? est / o.sales : null,
                            epc: o.installs ? o.revenue / o.installs : null,
                            roi: estC > 0 ? ((o.revenue - estC) / estC) * 100 : null,
                            i2r: o.installs ? (o.regs / o.installs) * 100 : null,
                            r2s: o.regs ? (o.sales / o.regs) * 100 : null,
                            i2s: o.installs ? (o.sales / o.installs) * 100 : null,
                        };
                    };
                    const offers = ((parsed.offersByGeo && parsed.offersByGeo[activeGeo]) || [])
                        .map(calcModel)
                        .filter((o) => o.installs > 0 || o.revenue > 0)
                        .sort((a, b) => b.estSpend - a.estSpend);
                    const osList = ((parsed.osByGeo && parsed.osByGeo[activeGeo]) || [])
                        .map(calcModel)
                        .filter((o) => o.installs > 0 || o.revenue > 0)
                        .sort((a, b) => b.estSpend - a.estSpend);

                    return {
                        accounts: accList,
                        totalSpend: geoSpend,
                        totalWaste,
                        geo,
                        hasMain: parsed.hasMain,
                        creatives,
                        offers,
                        osList,
                    };
                }, [parsed, activeGeo, preset]);

                // ── ctx для дочірніх компонентів ──
                const idLine = (arr) =>
                    arr
                        .filter((c) => !excluded[c.id])
                        .map((c) => c.id)
                        .join(", ");
                const copy = (text, label) => {
                    if (navigator.clipboard) navigator.clipboard.writeText(text);
                    else {
                        const ta = document.createElement("textarea");
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand("copy");
                        ta.remove();
                    }
                    setCopied(label);
                    setTimeout(() => setCopied(""), 1500);
                };
                const ctx = {
                    excluded,
                    setExcluded,
                    collapsed,
                    setCollapsed,
                    copied,
                    copy,
                    idLine,
                    preset,
                    checkedAccs,
                    setCheckedAccs,
                };
                const problemAccounts = analyzed ? analyzed.accounts.filter((a) => a.problem) : [];

                // ── редагування пресету поточного гео ──
                const updThresh = (metric, edge, val) => {
                    setGeoPresets((gp) => {
                        const list = [...(gp[activeGeo] || [])];
                        const i = activePresetIdx[activeGeo] ?? 0;
                        const cur = JSON.parse(JSON.stringify(list[i] || { name: "Дефолт", ...THRESHOLD_DEFAULT }));
                        cur[metric] = { ...cur[metric], [edge]: val };
                        list[i] = cur;
                        return { ...gp, [activeGeo]: list };
                    });
                };
                const updShared = (key, edge, val) =>
                    setShared((s) => (edge ? { ...s, [key]: { ...s[key], [edge]: val } } : { ...s, [key]: val }));

                const addPreset = () => {
                    const name = prompt("Назва нового пресету для " + geoName(activeGeo) + ":");
                    if (!name) return;
                    setGeoPresets((gp) => {
                        const list = [
                            ...(gp[activeGeo] || []),
                            { name, ...JSON.parse(JSON.stringify(THRESHOLD_DEFAULT)) },
                        ];
                        setActivePresetIdx((p) => ({ ...p, [activeGeo]: list.length - 1 }));
                        return { ...gp, [activeGeo]: list };
                    });
                };
                const renamePreset = () => {
                    const i = activeIdx;
                    const cur = (geoPresets[activeGeo] || [])[i];
                    const name = prompt("Нова назва пресету:", cur ? cur.name : "");
                    if (!name) return;
                    setGeoPresets((gp) => {
                        const list = [...(gp[activeGeo] || [])];
                        list[i] = { ...list[i], name };
                        return { ...gp, [activeGeo]: list };
                    });
                };
                const deletePreset = () => {
                    setGeoPresets((gp) => {
                        let list = [...(gp[activeGeo] || [])];
                        list.splice(activeIdx, 1);
                        if (!list.length) list = [{ name: "Дефолт", ...JSON.parse(JSON.stringify(THRESHOLD_DEFAULT)) }];
                        setActivePresetIdx((p) => ({ ...p, [activeGeo]: 0 }));
                        return { ...gp, [activeGeo]: list };
                    });
                };

                // ── пресети: Завантажити / Зберегти (File System Access API) ──
                const dataToSave = () => JSON.stringify({ geoPresets, activePresetIdx, shared }, null, 2);
                // автозапис у вже підключений файл при будь-якій зміні пресетів/спільних
                useEffect(() => {
                    if (!fileHandle) return;
                    (async () => {
                        try {
                            const w = await fileHandle.createWritable();
                            await w.write(dataToSave());
                            await w.close();
                            setSaveMsg("оновлено ✓");
                            setTimeout(() => setSaveMsg(""), 1500);
                        } catch (e) {}
                    })();
                }, [geoPresets, activePresetIdx, shared]);
                // Зберегти: якщо файл уже відкритий — пишемо в нього; інакше просимо обрати місце
                const savePreset = async () => {
                    try {
                        let handle = fileHandle;
                        if (!handle) {
                            handle = await window.showSaveFilePicker({
                                suggestedName: "presets.json",

                    W = Math.round(canvas.clientWidth * SCALE);

                    canvas.width = W;

                }
                window.addEventListener("resize", resize);
                resize();

                    ...b,
                    ax: 0.24 + 0.16 * Math.sin(i * 1.7),
                    ay: 0.22 + 0.18 * Math.cos(i * 2.3),
                    fx: 0.02 + i * 0.0042,
                    fy: 0.017 + i * 0.0051,
                    px: i * 1.3,
                    py: i * 2.1,
                    cx: 0.5 + 0.3 * Math.sin(i * 2.1),
                    cy: 0.5 + 0.3 * Math.cos(i * 1.5),
                    r: 0.62 + 0.3 * ((i * 0.53) % 1),
                }));

                function render() {
                    t += 0.6; // крок вдвічі більший, бо кадрів удвічі менше — швидкість руху та сама
                    const bg = ctx.createLinearGradient(0, 0, W, H);
                    bg.addColorStop(0, GRAD[0]);
                    bg.addColorStop(0.5, GRAD[1]);
                    bg.addColorStop(1, GRAD[2]);
                    ctx.fillStyle = bg;
                    ctx.fillRect(0, 0, W, H);
                    ctx.globalCompositeOperation = "lighter";
                    const minWH = Math.min(W, H);
                    for (const p of paths) {
                        const x = (p.cx + p.ax * Math.sin(t * p.fx + p.px)) * W;
                        const y = (p.cy + p.ay * Math.cos(t * p.fy + p.py)) * H;
                        const rad = p.r * minWH;
                        const alpha = p.base * (0.75 + 0.25 * Math.sin(t * 0.004 + p.px));
                        const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
                        g.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${LIGHT}%, ${alpha})`);
                        g.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, ${LIGHT}%, 0)`);
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(x, y, rad, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalCompositeOperation = "source-over";
                }

                function loop(now) {
                    if (!running) return;
                    raf = requestAnimationFrame(loop);
                    if (now - last < FRAME) return; // throttle до 30fps
                    last = now;
                    render();
                }
                raf = requestAnimationFrame(loop);

                // пауза, коли вкладка неактивна (0% CPU у фоні)
                document.addEventListener("visibilitychange", () => {
                    if (document.hidden) {
                        if (raf) cancelAnimationFrame(raf);
                        raf = null;
                    } else if (running && !raf) {
                        last = 0;
                        raf = requestAnimationFrame(loop);
                    }
                });

                toggle.addEventListener("click", () => {
                    running = !running;
                    toggle.textContent = running ? "✦ фон увімк." : "✦ фон вимк.";
                    canvas.style.opacity = running ? "1" : "0";
                    if (running) {
                        if (!raf) {
                            last = 0;
                            raf = requestAnimationFrame(loop);
                        }
                    } else if (raf) {
                        cancelAnimationFrame(raf);
                        raf = null;
                    }
                });
                canvas.style.transition = "opacity 0.6s";
            })();
        </script>
    </body>
</html>
